<!DOCTYPE html>
<html>

<head>
  <title>My Audio</title>
  <link rel="manifest" href="myAudio.webmanifest">
  <link rel="stylesheet" href="/stylesheets/common.css">
  <link rel="icon" type="image/x-icon" href="/images/favicon.png">
  <link href="/assets/fontawesome/css/fontawesome.css" rel="stylesheet">
  <link href="/assets/fontawesome/css/solid.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <div id="spinnerMod" class="overlay">
    <div class="spinner">
    </div>
  </div>

  <div class="upBox">
    <div class="fixedWidth">
      <div class="justify">
        <div class="left">
          <span class="outSelect actBC" id="outSel" onclick="toggleOutput(this.innerText)">Speakers</span>
          <i id="outSelI"></i>
          <div class="actC" id="outputSwitch" onclick="outputSwitch()"></div>
        </div>
        <div class="right">
          <div class="left">
            <span id="volMute" onclick="volumeToggleMute()">
              <i class="fa-solid fa-volume-xmark actC"></i>
            </span>
          </div>
          <div></div>
          <div class="right actC">
            <span id="volLevel" onclick="openVolumeMod()">0</span>
          </div>
        </div>
      </div>
      <div id="volumeMod" style="display: none; margin-top: 10px;">
        <div class="justify" style="padding: 20px; gap: 30px; background-color: lightblue;">
          <div class="left">
            <i id="volMinus" class="fa-solid fa-minus actBC" onclick="volumeDec()"></i>
          </div>
          <div class="volSlider">
            <input type="range" min="1" max="100" value="0" class="slider" id="volRange" disabled onchange="volumeSet()"
              oninput="showVolume()">
          </div>
          <div class="right">
            <i id="volPlus" class="fa-solid fa-plus actBC" onclick="volumeInc()"></i>
          </div>
        </div>
        <div class="justify" style="padding: 20px; background-color: lightblue;">
          <div class="left">
            <i id="volMinus" class="fa-solid fa-minus actBC" onclick="volumeDec('frontleft')"></i>
          </div>
          <span id="volLeft" class="left">0</span>
          <div class="left">
            <i id="volPlus" class="fa-solid fa-plus actBC" onclick="volumeInc('frontleft')"></i>
          </div>
          <div>balance</div>
          <div class="right">
            <i id="volMinus" class="fa-solid fa-minus actBC" onclick="volumeDec('frontright')"></i>
          </div>
          <span id="volRight" class="right">0</span>
          <div class="right">
            <i id="volPlus" class="fa-solid fa-plus actBC" onclick="volumeInc('frontright')"></i>
          </div>
        </div>
      </div>
      <div id="btDevMod" style="display: none; margin-top: 10px;">
        <div id="btDevList" style="padding: 20px; background-color: lightblue;"></div>
      </div>
      <div class="center" style="padding: 10px;">
        <span id="song" style="font-size: small;">-</span>
      </div>
      <div class="center">
        <div style="width: 60%;">
          <input type="range" min="1" max="100" value="0" class="slider" id="elapsed" onchange="setPosition(this.value)"
            onmousedown="setUpdateElapsed(0);" onmouseup="setUpdateElapsed(1000);" ontouchstart="setUpdateElapsed(0);"
            ontouchend="setUpdateElapsed(1000);">
        </div>
        <span class="right" style="font-size: small;" id="duration"> </span>
      </div>
      <div class="justify" style="padding: 20px;">
        <i class="fa-solid fa-shuffle fa-xs actC" style="color: lightgray;" id="shuffle" onclick="toggleShuffle()"></i>
        <i class="fa-solid fa-backward-step fa-sm actC" id="previous" onclick="mpdCmd('previous',[])"></i>
        <i class="fa-solid fa-backward fa-sm actC" id="backward" onclick="mpdCmd('seekcur',['-15'])"></i>
        <i class="fa-solid fa-play fa-xl actC" id="play" onclick="togglePlay()"></i>
        <i class="fa-solid fa-forward fa-sm actC" id="forward" onclick="mpdCmd('seekcur',['+15'])"></i>
        <i class="fa-solid fa-forward-step fa-sm actC" id="next" onclick="mpdCmd('next',[])"></i>
        <span>
          <i class="fa-solid fa-repeat fa-xs actC" style="color: lightgray;" id="repeat" onclick="toggleRepeat()"></i>
          <i class="fa-solid fa-1 fa-xs actC" style="color: lightgray;" id="single" onclick="toggleRepeat()"></i>
        </span>
      </div>
    </div>
  </div>
  <div class="lowBox">
    <ul class="noGrowNoShrink tabrow">
      <li class="pointer" onclick="queueTab()" id="queueTab">Queue</li>
      <li class="pointer" onclick="listPlaylists()" id="playlistsTab">Playlists</li>
      <li class="pointer" onclick="loadFiles()" id="filesTab">Files</li>
      <li class="pointer" onclick="loadStreams()" id="streamsTab">Streams</li>
      <li class="pointer" onclick="loadPodcasts()" id="podcastTab">Podcasts</li>
    </ul>
    <div class="center tabCntTitle" id="listTitle" style="display: none;">
      <label>Playlist</label>
      <input type="text" id="plName">
      <i class="fa-solid fa-undo actBC" onclick="plModNameUndo()"></i>
    </div>
    <div class="center tabCntTitle" id="streamEdit" style="display: none;">
      <div class="column">
        <label>Name</label>
        <label>Url</label>
        <label>Icon</label>
        <label>Caption</label>
      </div>
      <div class="column">
        <input type="text" id="stName">
        <input type="text" id="stUrl">
        <input type="text" id="stIcon">
        <input type="text" id="stCaption">
      </div>
    </div>
    <div class="center tabCntTitle" id="podcastEdit" style="display: none;">
      <div class="column">
        <label>Name</label>
        <label>Url</label>
        <label>File</label>
      </div>
      <div class="column">
        <input type="text" id="podName">
        <input type="text" id="podUrl">
        <input type="text" id="podFile">
      </div>
    </div>
    <div class="tabContent" id="tabCt">
    </div>
    <div class="cmdLine" id="plSelCmd" style="display: none;">
      <select class="myselect cmdBtn" name="plSelect" id="plSelect">
        <option value="">new playlist...</option>
      </select>
      <button class="cmdBtn" id="plSelConfirm" onclick="">confirm</button>
      <button class="cmdBtn" onclick="hideSelectPlaylist()">cancel</button>
    </div>
    <div class="cmdLine" id="queueCmds" style="display: none;">
      <button class="cmdBtn" onclick="quAddToPlaylist()">add to playlist</button>
      <button class="cmdBtn" onclick="quPlay()">play</button>
      <button class="cmdBtn" onclick="quRemove()">remove</button>
    </div>
    <div class="cmdLine" id="playlistCmds" style="display: none;">
      <button class="cmdBtn" onclick="plAddToQueue()">add to queue</button>
      <button class="cmdBtn" onclick="plReplQueue()">replace queue</button>
      <button class="cmdBtn" onclick="plModify()">modify</button>
      <button class="cmdBtn" onclick="plRemove()">remove</button>
    </div>
    <div class="cmdLine" id="playlistModifyCmds" style="display: none;">
      <button class="cmdBtn" onclick="plModCancel()">cancel</button>
      <button class="cmdBtn" onclick="plModSave()">save</button>
      <button class="cmdBtn" onclick="plModRemove()">remove</button>
    </div>
    <div class="cmdLine" id="filesCmds" style="display: none;">
      <button class="cmdBtn" onclick="fsAddToPlaylist()">add to playlist</button>
      <button class="cmdBtn" onclick="fsAddToQueue()">add to queue</button>
      <button class="cmdBtn" onclick="fsReplQueue()">replace queue</button>
    </div>
    <div class="cmdLine" id="streamsCmds" style="display: none;">
      <button class=" cmdBtn" onclick="stModify()">modify</button>
      <button class="cmdBtn" onclick="stReplQueue()">play</button>
      <button class="cmdBtn" onclick="stRemove()">remove</button>
    </div>
    <div class="cmdLine" id="streamsModifyCmds" style="display: none;">
      <button class="cmdBtn" onclick="stModCancel()">cancel</button>
      <button class="cmdBtn" onclick="stModSave()">save</button>
    </div>
    <div class="cmdLine" id="podcastCmds" style="display: none;">
      <button class=" cmdBtn" onclick="podModify()">modify</button>
      <button class="cmdBtn" onclick="podRemove()">remove</button>
      <button class="cmdBtn" onclick="podShow()">show episodes</button>
    </div>
    <div class="cmdLine" id="podcastModifyCmds" style="display: none;">
      <button class="cmdBtn" onclick="podModCancel()">cancel</button>
      <button class="cmdBtn" onclick="podModSave()">save</button>
    </div>
    <div class="cmdLine" id="downloadingfiles" style="display: none;"> </div>
    <div class="cmdLine" id="podcastSelectCmds" style="display: none;">
      <button class="cmdBtn" onclick="podAddToQueue()">add to queue</button>
      <button class="cmdBtn" onclick="podSelCancel()">cancel</button>
      <button class="cmdBtn" onclick="podShowContent()" id="podSCBtn">show content</button>
    </div>
    <div class="noGrowNoShrink right" style="width: 100%; height: 60px;">
      <div class="right" id="queueFn" style="width: 100%; justify-content: space-between;">
        <div class="left" style="font-size: medium;">
          <span id="queueDuration"></span>
        </div>
        <div class="right">
          <button class="lowBoxButton" onclick="initLiSelected()" id="cancel1" disabled>cancel</button>
          <button class="lowBoxButton" onclick="saveQueue()">save</button>
          <button class="lowBoxButton" onclick="clearQueue()">clear</button>
        </div>
      </div>
      <div class="right" id="playlistsFn" style="display: none;">
        <div class="left" style="font-size: medium;">
        </div>
        <div class="right">
          <button class="lowBoxButton" onclick="listPlaylists()" id="cancel2" disabled>cancel</button>
        </div>
      </div>
      <div class="right" id="filesFn" style="display: none;">
        <div class="left" style="font-size: medium;">
        </div>
        <div class="right">
          <button class="lowBoxButton" onclick="initLiSelected()" id="cancel3" disabled>cancel</button>
          <button class="lowBoxButton" onclick="goBack()" id="goBack" disabled>back</button>
        </div>
      </div>
      <div class="right" id="streamsFn" style="display: none;">
        <div class="left" style="font-size: medium;">
        </div>
        <div class="right">
          <button class="lowBoxButton" onclick="initLiSelected()" id="cancel4" disabled>cancel</button>
          <button class="lowBoxButton" onclick="newStream()">new stream</button>
        </div>
      </div>
      <div class="right" id="podcastFn" style="display: none;">
        <div class="left" style="font-size: medium;">
        </div>
        <div class="right">
          <button class="lowBoxButton" onclick="loadPodcasts()" id="cancel5">cancel</button>
          <button class="lowBoxButton" onclick="newPodcast()">new podcast</button>
        </div>
      </div>
    </div>

  </div>

  <!-- SCRIPTS-->
  <script src='/js/helpers.js'></script>
  <script src='/js/persistency.js'></script>

  <script>
    // PLAYER

    var player = {};
    var bluetooth = {};

    const btDevDefault = 'Bluetooth';
    var btDevName = btDevDefault;

    // OUTPUT

    function renderOutput(output) {
      if (output === 'Speakers') {
        document.getElementById('outSel').innerText = 'Speakers';
        document.getElementById('outSelI').className = 'fa-regular fa-volume-high';
      } else {
        document.getElementById('outSel').innerHTML = btDevName;
        document.getElementById('outSelI').className = 'fa-regular fa-headphones';
      }
    }

    function getOutput() {
      return document.getElementById('outSel').innerText;
    }

    async function toggleOutput(current) {
      let newOutput = 'Speakers';
      if (current === 'Speakers')
        newOutput = 'Bluetooth';
      renderOutput(newOutput);
      renderSpeakers();
      renderBT();
      renderVolume();
      try {
        let cfg = {};
        cfg = await readCfg();
        cfg.output = newOutput;
        saveCfg(cfg);
      }
      catch (err) { alert(err.message) }
    }

    async function outputSwitch() {
      let btPowered = bluetooth.selectedCtrl.Powered;
      let url = getOutput() === 'Speakers' ? `/speakers/toggle` : `/bt/cmd/power%20${btPowered === 'yes' ? 'off' : 'on'}`;
      let req = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' }
      };
      try {
        loadSpinner();
        await toutFetch(url, 5000, req);
      }
      catch (err) {
        alert(err.message);
      }
      setTimeout(unloadSpinner, 500);
    }

    // SPEAKERS

    var speakers = {};
    speakers.power = null;

    const initSpeakerStatus = () => {
      return toutFetch('/speakers/status', 5000)
        .then(res => res.json())
        .then(data => applySpeakersUpdate(data))
    }

    const applySpeakersUpdate = (val) => {
      speakers = { ...speakers, ...val };
    }

    const renderSpeakers = () => {
      if (getOutput() !== 'Speakers') return;
      document.getElementById('outputSwitch').innerHTML = (speakers.power === 'on' ? '<i class="fa-solid fa-toggle-on fa-xl"></i>' : '<i class="fa-solid fa-toggle-off fa-xl"></i>');
    }

    // MPD PLAYER

    const mpdCmd = (cmd, options) => {
      let req = {
        method: 'POST'
      };
      url = `/mpd/cmd/${cmd}`;
      for (opt of options)
        url += `/${opt}`;
      return toutFetch(url, 5000, req)
        .catch(err => alert(err.message));
    }

    const initPlayerStatus = () => {
      return toutFetch(`/mpd/status`, 5000)
        .then(res => res.json())
        .then(data => player = data)
    }

    const applyPlayerUpdate = (val) => {
      player = { ...player, ...val };
    }

    const setPosition = async (perc) => {
      if (player.hasOwnProperty('curSong')
        && player.hasOwnProperty('status')
        && !player.curSong.file.startsWith('http')) {
        setUpdateElapsed(0);
        let duration = parseFloat(player.status.duration);
        await mpdCmd('seekcur', [duration * perc / 100]);
        setUpdateElapsed(1000);
      }
    }

    const refreshElapsed = async () => {
      if (!player.status) return;
      if (!player.hasOwnProperty('curSong')) return;
      if (player.curSong.file.startsWith('http')) {
        let elapsed = parseFloat(player.status.elapsed) + 1.0;
        player.status.elapsed = elapsed.toString();
        document.getElementById('duration').innerText = `${secsToString(elapsed)}`;
        document.getElementById('elapsed').value = 0;
      } else {
        let elapsed = parseFloat(player.status.elapsed) + 1.0;
        let duration = parseFloat(player.status.duration);
        if (elapsed >= duration) {
          renderQueue();
        } else {
          player.status.elapsed = elapsed.toString();
          document.getElementById('duration').innerText = `${secsToString(elapsed)} - ${secsToString(duration)}`;
          document.getElementById('elapsed').value = 100 * elapsed / duration;
        }
      }
    }

    let updateElapsed = null;
    const setUpdateElapsed = (val) => {
      clearInterval(updateElapsed);
      if (val > 0)
        updateElapsed = setInterval(refreshElapsed, val);
    }

    const toggleShuffle = () => {
      if (!player) return;
      if (player.status.random === '1')
        mpdCmd('random', ['0']);
      else
        mpdCmd('random', ['1']);
    }

    const togglePlay = () => {
      if (!player) return;
      if (player.status.state === 'play')
        mpdCmd('pause', []);
      else
        mpdCmd('play', []);
    }

    const toggleRepeat = () => {
      if (!player) return;
      if (player.status.repeat === '0') {
        mpdCmd('repeat', ['1']);
      } else {
        if (player.status.single === '0')
          mpdCmd('single', ['1']);
        else {
          mpdCmd('repeat', ['0']);
          mpdCmd('single', ['0']);
        }
      }
    }

    function playerDefault() {
      document.getElementById('song').innerHTML = "-";
      document.getElementById('duration').innerText = "";
      document.getElementById('elapsed').value = 0;
      document.getElementById('play').className = "fa-solid fa-play fa-xl actC";
    }

    const renderPlayer = () => {
      // DEBUG
      // console.log(player);
      if (player?.curSong && player?.curSong?.file) {
        let curSong = player.curSong;
        let desc = "";
        if (curSong.file.startsWith('http')) {
          // stream
          if (curSong.hasOwnProperty('Name'))
            desc = `${curSong.Name}`;
          else
            desc = `${curSong.file.replaceAll(',', ':')}`;
        } else {
          // file
          if (!curSong.hasOwnProperty('Artist')) curSong.Artist = curSong.AlbumArtist;
          if (curSong.Artist == undefined && curSong.Album == undefined && curSong.Title == undefined)
            desc = curSong.file;
          else {
            desc = `${curSong.Artist == undefined ? '' : curSong.Artist}${curSong.Title == undefined ? '' : ' - ' + curSong.Title}${curSong.Album == undefined ? '' : ' - [' + curSong.Album + ']'}`;
            if (desc.length > 58)
              desc = `<center>${curSong.Artist == undefined ? '' : curSong.Artist}</center>\n<center>${curSong.Title == undefined ? '' : curSong.Title}</center>\n<center>${curSong.Album == undefined ? '' : '[' + curSong.Album + ']'}</center>`;
            if (desc.startsWith(' - ')) desc = desc.slice(3);
          }
        }
        document.getElementById('song').innerHTML = desc;
      }
      if (player.hasOwnProperty('status')) {
        if (player.status.error) alert(player.status.error);
        if (player.status.random === '1')
          document.getElementById('shuffle').style.color = null;
        else
          document.getElementById('shuffle').style.color = 'lightgray';
        if (player.status.repeat === '1')
          document.getElementById('repeat').style.color = null;
        else
          document.getElementById('repeat').style.color = 'lightgray';
        if (player.status.single === '1')
          document.getElementById('single').style.color = null;
        else
          document.getElementById('single').style.color = 'lightgray';
        if (player.status.state === 'play') {
          document.getElementById('play').className = "fa-solid fa-pause fa-xl actC";
          refreshElapsed();
          setUpdateElapsed(1000);
        } else {
          document.getElementById('play').className = "fa-solid fa-play fa-xl actC";
          setUpdateElapsed(0);
        }
      }
    }

    // BLUETOOTH

    const connectDev = async (idx) => {
      loadSpinner();
      try {
        if (bluetooth.devices[idx].Paired == 'no') {
          await toutFetch(`/bt/cmd/pair%20${escape(bluetooth.devices[idx].Address)}`, 60000, { method: 'POST' });
          await msWait(600);
        }
        if (bluetooth.devices[idx].Trusted == 'no') {
          await toutFetch(`/bt/cmd/trust%20${escape(bluetooth.devices[idx].Address)}`, 60000, { method: 'POST' });
          await msWait(600);
        }
        await toutFetch(`/bt/cmd/connect%20${escape(bluetooth.devices[idx].Address)}`, 60000, { method: 'POST' });
      } catch (err) {
        alert(`Failed to connect to ${bluetooth.devices[idx].Name}: ${err.message}`);
      }
      await msWait(1000);
      unloadSpinner();
    }

    const deleteDev = async (idx) => {
      toutFetch(`/bt/cmd/remove%20${escape(bluetooth.devices[idx].Address)}`, 60000, {
        method: 'POST'
      })
        .then(async () => {
          await bluetooth.devices.splice(idx, 1);
        })
        .catch((err) => alert(`Failed to remove ${bluetooth.devices[idx].Name}: ${err.message}`));
    }

    const openBtDevMod = () => {
      if (document.getElementById("btDevMod").style.display === "block") return;
      document.getElementById("btDevMod").style.display = "block";
    }

    const closeBtDevMod = () => {
      if (document.getElementById("btDevMod").style.display === "none") return;
      document.getElementById("btDevMod").style.display = "none";
    }

    const initBtStatus = () => {
      return toutFetch(`/bt/status`, 5000)
        .then(res => res.json())
        .then(data => {
          bluetooth = data;
        })
    }

    // ── state appliers (always run, no DOM touches) ──────────────────────────

    const applyBTctrlPower = ({ address, powered }) => {
      bluetooth.controllers = bluetooth.controllers.map(c =>
        c.Address === address ? { ...c, Powered: powered } : c
      );
      if (bluetooth.selectedCtrl?.Address === address)
        bluetooth.selectedCtrl = { ...bluetooth.selectedCtrl, Powered: powered };
      // disconnect device if powered off
      if (powered === 'no' && bluetooth.selectedCtrl?.Address === address)
        bluetooth.selectedCtrl.ConnectedDevice = null;
    };

    const applyBTdeviceFound = ({ address, name }) => {
      if (!bluetooth.devices.some(d => d.Address === address))
        bluetooth.devices.push({ Address: address, Name: name });
    };

    const applyBTdeviceConnected = ({ address, name }) => {
      const dev = bluetooth.devices.find(d => d.Address === address)
        ?? { Address: address, Name: name };
      if (bluetooth.selectedCtrl)
        bluetooth.selectedCtrl.ConnectedDevice = dev;
    };

    const applyBTdeviceDisconnected = ({ address }) => {
      if (bluetooth.selectedCtrl?.ConnectedDevice?.Address === address)
        bluetooth.selectedCtrl.ConnectedDevice = null;
    };

    const applyBTdeviceRemoved = ({ address }) => {
      bluetooth.devices = bluetooth.devices.filter(d => d.Address !== address);
      if (bluetooth.selectedCtrl?.ConnectedDevice?.Address === address)
        bluetooth.selectedCtrl.ConnectedDevice = null;
    };

    const applyBTdeviceBatteryUpdate = ({ address, battery }) => {
      if (bluetooth.selectedCtrl?.ConnectedDevice?.Address === address)
        bluetooth.selectedCtrl.ConnectedDevice.battery = battery;
    };

    // ── renderers (only touch DOM, read from bluetooth) ──────────────────────

    const renderBTdesc = () => {
      const connected = bluetooth.selectedCtrl?.ConnectedDevice;
      if (connected) {
        const batLev = parseInt(connected.battery);
        const batIco = !connected.battery ? 'quarter'
          : batLev > 80 ? 'full'
            : batLev > 30 ? 'half' : 'quarter';
        const batStr = connected.battery ?? '--';
        btDevName = `<span style="font-size:medium">${connected.Name}<br>
                     <i class="fa-regular fa-battery-${batIco}"></i>&nbsp;${batStr}</span>`;
      } else {
        btDevName = btDevDefault;
      }
      if (getOutput() !== 'Speakers') {
        document.getElementById('outSel').innerHTML = btDevName;
        document.getElementById('outSelI').className = 'fa-regular fa-headphones';
      }
    };

    const renderBTctrlPower = () => {
      if (getOutput() === 'Speakers') return;
      const powered = bluetooth.selectedCtrl?.Powered === 'yes';
      document.getElementById('outputSwitch').innerHTML = powered
        ? '<i class="fa-solid fa-toggle-on fa-xl"></i>'
        : '<i class="fa-solid fa-toggle-off fa-xl"></i>';
    };

    const renderBTdevices = () => {
      const ctrl = bluetooth.selectedCtrl;
      if (getOutput() === 'Speakers'
        || ctrl?.Powered === 'no'
        || ctrl?.ConnectedDevice !== null
        || bluetooth.devices.length === 0) {
        closeBtDevMod();
        return;
      }
      const html = bluetooth.devices.map((dev, idx) =>
        `<div class="justify">
           <span class="pointer" onclick="connectDev(${idx})">${dev.Name}</span>
           <span class="right">
             <i class="fa-regular fa-trash-can pointer" onclick="deleteDev(${idx})"></i>
           </span>
         </div>`
      ).join('');
      document.getElementById('btDevList').innerHTML = html;
      openBtDevMod();
    };

    const renderBT = () => {
      // DEBUG
      // console.log('renderBT', bluetooth);
      renderBTctrlPower();
      renderBTdevices();
      renderBTdesc();
    };

    // PACTL / VOLUME

    var pactl = {
      defaultSink: null,
      volume: [],
    };

    const applyPactlSinkUpdate = (sink) => {
      pactl.defaultSink = sink;
    };

    const applyPactlVolumeUpdate = (vol) => {
      if (!pactl.volume.some(d => d.sink === vol.sink))
        pactl.volume.push(vol);
      else
        pactl.volume = pactl.volume.map(d =>
          d.sink === vol.sink ? { ...d, ...vol } : d
        );
    };

    const renderVolumeEnabled = (vol) => {
      document.getElementById('volRange').value = vol.volume.split('%')[0];
      document.getElementById('volRange').disabled = false;
      document.getElementById('volLevel').innerText = vol.volume.split('%')[0];
      document.getElementById('volLeft').innerText = vol.volumeLeft.split('%')[0];
      document.getElementById('volRight').innerText = vol.volumeRight.split('%')[0];
      document.getElementById('volMute').innerHTML = vol.mute === 'yes'

    function initEventListeners() {
      const tabCt = document.getElementById("tabCt");

      // this is not necessary if you only call this once during initialization
      // Remove any existing listeners if you're calling this multiple times
      // (or better, only set these up once in your initialization code)
      // tabCt.removeEventListener('pointerdown', handlePointerDown);
      // tabCt.removeEventListener('pointerup', handlePointerUp);

      // Add delegated event listeners
      // the { passive: option} and 'poinercancel' and 'scroll' events are KEY to properly manage long-press on mobile
      tabCt.addEventListener('pointerdown', handlePointerDown, { passive: true });
      tabCt.addEventListener('pointerup', handlePointerUp, { passive: true });
      tabCt.addEventListener('pointercancel', handlePointerCancel, { passive: true });
      tabCt.addEventListener('scroll', handleScroll, { passive: true });
    }

    function handlePointerDown(event) {
      const li = event.target.closest('.tabCntLine');
      if (li) {
        const idx = parseInt(li.dataset.idx, 10);
        isScrolling = false;
        // Clear any existing timeout
        if (liSelectTimeout) {
          clearTimeout(liSelectTimeout);
          liSelectTimeout = null;
        }
        limd(idx, event);
      }
    }

    function handlePointerUp(event) {
      const li = event.target.closest('.tabCntLine');
      if (li) {
        const idx = parseInt(li.dataset.idx, 10);
        // Only call limu if we're not scrolling
        if (!isScrolling) {
          limu(idx);
        }
      }
    }

    function handlePointerCancel(event) {
      // Pointer was cancelled (usually due to scrolling)
      // Clear the timeout to prevent false long-press
      if (liSelectTimeout) {
        clearTimeout(liSelectTimeout);
        liSelectTimeout = null;
      }
    }

    function handleScroll(event) {
      // User is scrolling - cancel any pending long-press
      isScrolling = true;
      if (liSelectTimeout) {
        clearTimeout(liSelectTimeout);
        liSelectTimeout = null;
      }
    }

      if (multipleliSelect) {
        if (liSelected.includes(idx)) {

        }
        liSelected = [];
        liSelected.push(idx);

        liSelectTimeout = setTimeout(liSelectMultiple, 700);
      }
      // DEBUG

    }

      if (item.file.startsWith('http')) {

          res.desc = `${item.Name} - <small><i>${item.file.replaceAll(',', ':')}</i></small>`;
        else
          res.desc = `${item.file.replaceAll(',', ':')}`;
      } else {
        if (!item.hasOwnProperty('Artist')) item.Artist = item.AlbumArtist;
        if (item.Artist == undefined && item.Album == undefined && item.Title == undefined)
          res.desc = item.file;
        else {
          res.desc = `${item.Artist == undefined ? '' : item.Artist}${item.Album == undefined ? '' : ' - ' + item.Album}${item.Title == undefined ? '' : ' - ' + item.Title}`;
          if (res.desc.startsWith(' - ')) res.desc = res.desc.slice(3);
        }
      }
      if (player.hasOwnProperty('curSong') &&
        player.curSong.file === item.file) {
        res.style = 'style="color: blue; "';
        if (player.status.state === "play")
          res.playing += '&nbsp&nbsp&nbsp&nbsp<i class="fa-solid fa-music fa-2xs"></i>';
      }
      return res;

      if (streamId >= 0 && streamId < streams.length) {
        // modifying an element
        streams[streamId].name = document.getElementById('stName').value;
        streams[streamId].url = document.getElementById('stUrl').value;
        streams[streamId].icon = document.getElementById('stIcon').value;
        streams[streamId].caption = document.getElementById('stCaption').value;
      }
      if (streamId == streams.length) {
        // adding an element
        let stEl = {
          name: document.getElementById('stName').value,
          url: document.getElementById('stUrl').value,
          icon: document.getElementById('stIcon').value,
          caption: document.getElementById('stCaption').value
        };
        streams.push(stEl);
      }
      req = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(streams)
      };
      return toutFetch('/stream', 5000, req)
        .then(() => stModCancel())
        .catch(err => {
          alert(err.message);
        });
    }

    // PODCAST

    var podcasts = [];
    var podcastId = -1;
    var feed = [];

    const loadPodcasts = async () => {
      selectTab("podcastTab");
      selectFN("podcastFn");
      selectCmds("podcastCmds");
      toutFetch(`/podcast`, 5000)
        .then(data => data.json())
        .then(data => {
          podcasts = data.sort((a, b) => {
            if (a.name < b.name) return -1;
            if (a.name > b.name) return 1;
            return 0;
          });;
          if (podcasts.length) {
            let pl_content = '<ul class="tabCntList">';
            for ([idx, item] of podcasts.entries())
              pl_content += `<li class="tabCntLine" data-idx="${idx}" id="li_${idx}">${item.name}</li>`;
            pl_content += "</ul>";
            setTabContent(pl_content);
          } else
            setTabContent('<ul class="tabCntList"><li>Empty.</li></ul>');
        })
        .catch(err => alert(err.message));
    }

    function showPodcastEdit(podEl) {
      document.getElementById("podName").value = podEl.name;
      document.getElementById("podUrl").value = podEl.url;
      document.getElementById("podFile").value = podEl.file;
      document.getElementById("podcastEdit").style.display = "flex";
    }

    function hidePodcastEdit() {
      document.getElementById("podcastEdit").style.display = "none";
    }

    const newPodcast = () => {
      selectCmds("podcastModifyCmds");
      showCmds();
      podcastId = podcasts.length;
      let podEl = {
        name: "",
        url: "",
        file: ""
      };
      showPodcastEdit(podEl);
    }

    const podModify = () => {
      let podEl = podcasts[liSelected[0]];
      podcastId = liSelected[0];
      selectCmds("podcastModifyCmds");
      showCmds();
      showPodcastEdit(podEl);
    }

    const podRemove = async () => {
      let text = "This operation cannot be undone...";
      if (confirm(text) == true) {
        await liSelected.reverse();
        await liSelected.map(el => podcasts.splice(el, 1));
        toutFetch('/podcast', 5000, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(podcasts)
        })
          .then(() => podModCancel())
          .catch(err => {
            alert(err.message);
          });
      }
    }

    const podModCancel = () => {
      hidePodcastEdit();
      loadPodcasts();
    }

    const podModSave = () => {
      if (podcastId < 0 || podcastId > (podcasts.length + 1)) return;
      if (podcastId >= 0 && podcastId < podcasts.length) {
        // modifying an element
        podcasts[podcastId].name = document.getElementById('podName').value;
        podcasts[podcastId].url = document.getElementById('podUrl').value;
        podcasts[podcastId].file = document.getElementById('podFile').value;
      }
      if (podcastId == podcasts.length) {
        // adding an element
        let podEl = {
          name: document.getElementById('podName').value,
          url: document.getElementById('podUrl').value,
          file: document.getElementById('podFile').value
        };
        podcasts.push(podEl);
      }
      req = {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(podcasts)
      };
      return toutFetch('/podcast', 5000, req)
        .then(() => podModCancel())
        .catch(err => {
          alert(err.message);
        });
    }

    const showEpisodesList = () => {
      if (feed.length) {
        let pl_content = '<ul class="tabCntList">';
        feed.map((el, idx) => pl_content += `<li class="tabCntLine" data-idx="${idx}" id="li_${idx}">${el.date} - ${el.title} ${el.duration ? '[' + secsToString(el.duration) + ']' : ''}</li><div id="liDesc_${idx}" class="modal" style="display: none;">${el.contentSnippet}</div>`)
        pl_content += "</ul>";
        setTabContent(pl_content);
      } else
        setTabContent('<ul class="tabCntList"><li>Empty.</li></ul>');
    }

    const podShow = () => {
      toutFetch(`/podcast/episodes/${encodeURIComponent(podcasts[liSelected[0]].url)}`, 5000)
        .then(res => res.json())
        .then(data => {
          feed = data;
          selectCmds('podcastSelectCmds');
          showCmds();
          showEpisodesList();
        })
        .catch(err => {
          alert(err.message);
        });
    }

    const podSelCancel = () => {
      let btn = document.getElementById('podSCBtn');
      if (btn.innerHTML === 'hide content')
        liSelected.map(el => {
          let div = document.getElementById(`liDesc_${el}`);
          div.style.display = 'none';
          btn.innerHTML = 'show content';
        });
      initLiSelected();
    }

    const podShowContent = () => {
      let btn = document.getElementById('podSCBtn');
      liSelected.map(el => {
        let div = document.getElementById(`liDesc_${el}`);
        if (div.style.display === 'block') {
          div.style.display = 'none';
          btn.innerHTML = 'show content';
        } else {
          div.style.display = 'block';
          btn.innerHTML = 'hide content';
        }
      });
    }

    const rmDownloadingFile = (name) => {
      toutFetch(`/podcast/remove/downloadingFile/${encodeURIComponent(name)}`, 5000, { method: 'POST' })
        .catch(err => alert(err.message));
    }

    const showDownloadingFiles = () => {
      toutFetch(`/podcast/downloadingfiles`, 5000)
        .then((res) => res.json())
        .then((data) => {
          if (data.length > 0) {
            let downloadingfiles = "";
            // data.map(el => downloadingfiles += `<p class="infoLine">${el.name} - ${el.progress} <i onclick="rmDownloadingFile('${el.name}')" class="fa-regular fa-xmark actC"></i></p>`);
            data.map(el => downloadingfiles += `<p class="infoLine">${el.name} - ${el.progress.includes('FAILED') ? '<i onclick="rmDownloadingFile(' + '\'' + el.name + '\')" class="fa-regular fa-xmark actC"></i>' : el.progress} </p>`);
            document.getElementById('downloadingfiles').innerHTML = downloadingfiles;
            if (document.getElementById('downloadingfiles').style.display === "none")
              document.getElementById('downloadingfiles').style.display = "block";
            setTimeout(showDownloadingFiles, 1000);
          } else {
            document.getElementById('downloadingfiles').style.display = "none";
          }
        })
        .catch(err => alert(err.message))
    }

    const podAddToQueue = () => {
      loadSpinner();
      liSelected.map(el => {
        toutFetch(`/podcast/add/filename/${encodeURIComponent(feed[el].title)}/url/${encodeURIComponent(feed[el].url)}`, 60000, { method: 'POST' })
          .then(() => {
            initLiSelected();
            setTimeout(showDownloadingFiles, 500);
          })
          .catch(err => alert(err.message))
          .finally(() => unloadSpinner());
      });
    }

    const initSSE = () => {
      const es = new EventSource('/events');

      es.onmessage = async (e) => {
        const event = JSON.parse(e.data);
        // DEBUG
        console.debug('Received event:', event);
        switch (event.type) {

          case 'connected':
            console.info('SSE connected, fetching initial status...');
            await initBtStatus();
            await initSpeakerStatus();
            await initPactlStatus();
            renderSpeakers();
            renderBT();
            renderVolume();
            await initPlayerStatus();
            renderPlayer();
            await initQueue();
            renderQueue();
            break;
          // PACTL
          case 'volume_changed':
            applyPactlVolumeUpdate(event.data);
            renderVolume();
            break;
          case 'default_sink_changed':
            applyPactlSinkUpdate(event.data);
            renderOutput(event.data.syncType === 'speakers' ? 'Speakers' : 'Bluetooth');
            renderVolume();
            break;
          // SPEAKERS
          case 'speakers_powered_on':
          case 'speakers_powered_off':
            applySpeakersUpdate(event.data);
            renderSpeakers();
            renderVolume();
            break;
          // BLUETOOTH
          case 'bt_controller_powered_on':
            applyBTctrlPower({ address: event.data.address, powered: 'yes' });
            renderBT();
            renderVolume();
            break;
          case 'bt_controller_powered_off':
            applyBTctrlPower({ address: event.data.address, powered: 'no' });
            renderBT();
            renderVolume();
            break;
          case 'bt_device_found':
            applyBTdeviceFound({ address: event.data.address, name: event.data.name });
            renderBTdevices();
            break;
          case 'bt_device_connected':
            applyBTdeviceConnected({ address: event.data.address, name: event.data.name });
            renderBT();
            break;
          case 'bt_device_disconnected':
            applyBTdeviceDisconnected({ address: event.data.address });
            renderBT();
            renderVolume();
            break;
          case 'bt_device_removed':
            applyBTdeviceRemoved({ address: event.data.address });
            renderBTdevices();
            break;
          case 'bt_battery_changed':
            applyBTdeviceBatteryUpdate({ address: event.data.address, battery: event.data.battery });
            renderBTdesc();
            break;
          // MPD
          case 'mpd_state_changed':
            applyPlayerUpdate({ status: event.data.status, ...(event.data?.curSong && { curSong: event.data.curSong }) });
            renderPlayer();
            renderQueue();
            break;
          case 'mpd_options_changed':
            applyPlayerUpdate({ status: event.data.status });
            renderPlayer();
            break;
          case 'mpd_queue_changed':
            applyQueueUpdate(event.data.songs);
            renderQueue();
            break;
          case 'stored_playlist_changed':
            // nothing to do
            break;
        }
      };

      es.onerror = () => console.warn('SSE lost, browser will retry');
      return es;
    };

    // STARTUP
    const initPactlStatus = async () => {
      return toutFetch('/pactl/status', 5000)
        .then(res => res.json())
        .then(data => {
          applyPactlSinkUpdate({ sinkName: data.sinkName, syncType: data.syncType });
          renderOutput(data.type === 'speakers' ? 'Speakers' : 'Bluetooth');
          applyPactlVolumeUpdate(data);
        });
    };

    async function startup() {
      loadSpinner();
      playerDefault();
      const cfg = await readCfg();
      initEventListeners();
      selectQueueTab();
      initSSE();                                // hydration happens inside 'connected'
      unloadSpinner();
    }

    startup();
  </script>


</body>
